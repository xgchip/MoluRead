name: Syntax checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check MoluRead JavaScript
        run: |
          node --check assets/js/yiyan.js
          node --check assets/js/tag-cloud.js
          node --check assets/typecho/config/js/navigation.js
      - name: Check whitespace
        run: git diff --check
